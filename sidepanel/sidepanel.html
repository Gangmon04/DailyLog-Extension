<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyLog - Sidebar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="app-shell">
    
    <!-- Top Navigation -->
    <header class="top-nav">
      <div class="nav-left">
        <img src="../icons/logo.png" alt="DailyLog" class="brand-logo-img">
        <div class="brand-block">
          <span class="brand-name">DailyLog</span>
        </div>
      </div>

      <div class="nav-right">
        <button id="btnSyncFolder" class="btn-ghost-icon" title="Connect Local Folder (D:\Personal\Data)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            <polyline points="12 11 12 17 15 14"></polyline>
          </svg>
        </button>
        <button id="btnThemeToggle" class="btn-ghost-icon" title="Toggle Theme (Dark / Light)">
          <span id="themeIcon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span>
        </button>

        <button id="btnOpenDashboard" class="btn-ghost-icon" title="Open Full Workspace">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </button>

        <div class="profile-avatar-btn" title="Profile: G">
          <span>G</span>
        </div>
      </div>
    </header>

    <!-- Date & Scope Strip -->
    <div class="scope-bar">
      <div class="date-navigator">
        <button id="btnPrevDay" class="chevron-btn" title="Previous day"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>
        
        <div class="date-picker-container" id="datePickerContainer" title="Click to choose a date">
          <div class="date-display-overlay" id="dateDisplayOverlay">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span id="currentDateDisplay">Today &mdash; Loading...</span>
            <span class="dropdown-caret"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></span>
          </div>

          <!-- Custom Themed Calendar Popover -->
          <div class="calendar-popover" id="calendarPopover" hidden>
            <div class="cal-popover-header">
              <button type="button" class="cal-nav-btn" id="btnCalPrevMonth" title="Previous month">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <span class="cal-month-title" id="calMonthTitle">September 2026</span>
              <button type="button" class="cal-nav-btn" id="btnCalNextMonth" title="Next month">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
            <div class="cal-weekdays">
              <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div class="cal-days-grid" id="calDaysGrid"></div>
            <div class="cal-popover-footer">
              <button type="button" class="cal-footer-btn" id="btnCalJumpToday">Today</button>
            </div>
          </div>
        </div>

        <button id="btnNextDay" class="chevron-btn" title="Next day"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>
        <button id="btnJumpToday" class="today-chip-btn" title="Jump to Today">Today</button>
      </div>

      <div class="view-segments">
        <button class="seg-btn active" data-view="today">Day</button>
        <button class="seg-btn" data-view="week">Week</button>
        <button class="seg-btn" data-view="all">All</button>
      </div>
    </div>

    <!-- Quick Capture Box -->
    <div class="command-box">
      <div class="input-line">
        <input type="text" id="taskTextInput" placeholder="Add accomplishment or task bullet..." autocomplete="off">
        <button id="btnSubmitTask" class="submit-btn" title="Add Task (Enter)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Add
        </button>
      </div>
    </div>

    <!-- Task List (Grouped by Module) -->
    <main class="tasks-scroll-canvas" id="tasksCanvas">
      <!-- Dynamically generated sections -->
    </main>

    <!-- Side Panel Notes Scratchpad -->
    <div class="scratchpad-box">
      <div class="scratchpad-header">
        <span class="scratchpad-label">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          Daily Scratchpad / Meeting Notes
        </span>
        <span id="notesSaveIndicator" class="save-chip">Saved</span>
      </div>
      <textarea id="dailyNotesText" placeholder="Jot quick notes, PR links, or meeting takeaways..."></textarea>
    </div>

    <!-- Bottom Action Dock -->
    <footer class="dock-footer">
      <div class="dock-actions-left">
        <button id="btnCopyStandup" class="dock-icon-btn" title="Copy Standup Report (Slack / Teams)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </button>

        <button id="btnCopyTxt" class="dock-icon-btn" title="Copy Journal (.TXT format)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </button>

        <button id="btnDownloadTxt" class="dock-icon-btn" title="Download Daily Log (.txt file)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
      </div>

      <div class="dock-actions-right">
        <button id="btnLaunchFull" class="dock-icon-btn" title="Open Fullscreen Workspace Dashboard">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </button>
      </div>
    </footer>

    <!-- Toast container -->
    <div id="toastContainer" class="toast-portal"></div>
  </div>

  <script src="../shared/localSync.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
